<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictate — Mini</title>
  <meta name="theme-color" content="#0a0a0a">
  <link rel="manifest" href="/manifest-mini.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root[data-theme="dark"] {
      --bg: #0a0a0a; --bg-surface: #141414; --border: #2e2e2e;
      --text: #e4e4e4; --text-muted: #a0a0a0; --text-faint: #6a6a6a;
      --accent: #f5f5f5; --accent-contrast: #0a0a0a; --accent-dim: rgba(255,255,255,0.08); --accent-glow: rgba(255,255,255,0.14);
      --danger: #ef4444; --danger-dim: rgba(239,68,68,0.08);
      --success: #22c55e; --warning: #eab308;
    }
    :root[data-theme="light"] {
      --bg: #fafafa; --bg-surface: #fff; --border: #e2e2e2;
      --text: #1a1a1a; --text-muted: #666; --text-faint: #aaa;
      --accent: #111111; --accent-contrast: #ffffff; --accent-dim: rgba(0,0,0,0.055); --accent-glow: rgba(0,0,0,0.1);
      --danger: #dc2626; --danger-dim: rgba(220,38,38,0.05);
      --success: #16a34a; --warning: #ca8a04;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; align-items: center; justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden; user-select: none;
    }
    .mini-app {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 12px; width: 100%; max-width: 200px;
    }
    .record-btn {
      width: 64px; height: 64px; border-radius: 50%;
      border: 2px solid var(--border); background: var(--bg-surface);
      color: var(--accent); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .record-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
    .record-btn:active { transform: scale(0.88); box-shadow: 0 0 0 3px var(--accent-glow); }
    .record-btn.recording {
      border-color: var(--danger); background: var(--danger-dim); color: var(--danger);
      animation: pulse-ring 1.5s ease-in-out infinite;
    }
    .record-btn.processing { border-color: var(--warning); color: var(--warning); pointer-events: none; opacity: 0.7; }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
      50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .stop-icon { width: 16px; height: 16px; border-radius: 3px; background: var(--danger); }
    .status-row {
      display: flex; align-items: center; gap: 6px; width: 100%; justify-content: center;
    }
    .status {
      font-size: 0.68rem; color: var(--text-faint); font-weight: 500;
      text-align: center; transition: color 0.2s;
    }
    .status.active { color: var(--accent); }
    .status.processing { color: var(--warning); }
    .status.done { color: var(--success); }
    .status.error { color: var(--danger); }
    .timer {
      font-size: 0.72rem; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--text-muted); display: none;
    }
    .timer.visible { display: block; }
    .copy-btn {
      padding: 4px 10px; border: 1px solid var(--border); border-radius: 5px;
      background: transparent; color: var(--text-muted); font-size: 0.66rem;
      font-weight: 550; cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .copy-btn:hover { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .copy-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .mini-link {
      position: fixed; bottom: 6px; right: 8px;
      font-size: 0.58rem; color: var(--text-faint); text-decoration: none;
    }
    .mini-link:hover { color: var(--text-muted); }
    /* streaming cursor */
    .streaming .status::after {
      content: ''; display: inline-block; width: 4px; height: 10px;
      background: var(--warning); margin-left: 3px; border-radius: 1px;
      animation: blink 0.6s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div class="mini-app">
    <button id="toggleBtn" class="record-btn" aria-label="Start recording">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    </button>
    <div class="status-row">
      <span id="timer" class="timer">00:00</span>
      <span id="status" class="status">Ready</span>
    </div>
    <button id="copyBtn" class="copy-btn" disabled>Copy</button>
  </div>
  <a href="/" class="mini-link">Full view</a>
  <script>
    // Theme
    const stored = localStorage.getItem('dictationTheme');
    if (stored) document.documentElement.setAttribute('data-theme', stored);
    else if (window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.setAttribute('data-theme', 'light');

    // State
    let mediaRecorder, audioChunks = [], isRecording = false, cancelled = false;
    let timerInterval, secondsElapsed = 0;
    let transcript = '';
    let processingAbortController = null;

    const toggleBtn = document.getElementById('toggleBtn');
    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');
    const copyBtn = document.getElementById('copyBtn');

    // Append mode support (shared with main view via localStorage)
    function isAppendMode() { return localStorage.getItem('appendMode') === 'true'; }
    function getAccumulatedTranscript() { return localStorage.getItem('accumulatedTranscript') || ''; }
    function setAccumulatedTranscript(t) { localStorage.setItem('accumulatedTranscript', t); }

    function setStatus(t, type = '') { statusEl.textContent = t; statusEl.className = 'status ' + type; }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
        else {
          const ta = document.createElement('textarea'); ta.value = text;
          ta.style.cssText = 'position:fixed;opacity:0';
          document.body.appendChild(ta); ta.select(); document.execCommand('copy');
          document.body.removeChild(ta);
        }
        return true;
      } catch { return false; }
    }

    function startTimer() {
      secondsElapsed = 0; timerEl.textContent = '00:00'; timerEl.classList.add('visible');
      timerInterval = setInterval(() => {
        secondsElapsed++;
        timerEl.textContent = String(Math.floor(secondsElapsed/60)).padStart(2,'0') + ':' + String(secondsElapsed%60).padStart(2,'0');
      }, 1000);
    }
    function stopTimer() { clearInterval(timerInterval); timerEl.classList.remove('visible'); }

    async function transcribeAndClean(audioBlob) {
      toggleBtn.classList.add('processing');
      toggleBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/></circle></svg>';

      const abortController = new AbortController();
      processingAbortController = abortController;

      // Elapsed timer during processing
      let procSeconds = 0;
      const procTimer = setInterval(() => {
        procSeconds++;
        setStatus(`Processing… ${procSeconds}s`, 'processing');
      }, 1000);

      try {
        setStatus('Transcribing…', 'processing');
        const fd = new FormData();
        fd.append('audio', audioBlob, 'rec.webm');
        const uRes = await fetch('/upload', { method: 'POST', body: fd, signal: abortController.signal });
        if (uRes.status === 401) { window.location.href = '/login'; return; }
        if (!uRes.ok) throw new Error(`Upload: ${uRes.status}`);
        const uData = await uRes.json();
        if (uData.error) throw new Error(uData.error);
        const raw = uData.rawTranscript || '';

        // Cleanup with streaming
        let cleaned = '';
        const doClean = localStorage.getItem('cleanTranscript') !== 'false';
        if (doClean && raw.trim()) {
          setStatus('Cleaning…', 'processing');
          document.querySelector('.mini-app').classList.add('streaming');
          const prompt = localStorage.getItem('activePromptId') || 'default';
          // Attempt streaming cleanup
          try {
            const sRes = await fetch('/cleanup-stream', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ rawTranscript: raw, prompt: '' }),
              signal: abortController.signal
            });
            if (sRes.status === 401) { window.location.href = '/login'; return; }
            if (!sRes.ok) throw new Error('stream-fail');
            const reader = sRes.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop();
              for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const json = JSON.parse(line.slice(6));
                if (json.error) throw new Error(json.error);
                if (json.done) break;
                if (json.text) cleaned += json.text;
              }
            }
          } catch (streamErr) {
            if (streamErr.name === 'AbortError') throw streamErr;
            // Fallback to non-streaming
            const cRes = await fetch('/cleanup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ rawTranscript: raw, prompt: '' }),
              signal: abortController.signal
            });
            if (cRes.status === 401) { window.location.href = '/login'; return; }
            if (cRes.ok) {
              const cData = await cRes.json();
              cleaned = cData.cleanedTranscript || raw;
            } else {
              cleaned = raw;
            }
          }
          document.querySelector('.mini-app').classList.remove('streaming');
        } else {
          cleaned = raw;
        }

        transcript = cleaned || raw;

        // Append mode
        if (isAppendMode() && transcript.trim()) {
          const existing = getAccumulatedTranscript();
          const newAccumulated = existing ? existing + '\n\n' + transcript : transcript;
          setAccumulatedTranscript(newAccumulated);
          await copyToClipboard(newAccumulated);
        } else {
          if (transcript.trim()) setAccumulatedTranscript(transcript);
          await copyToClipboard(transcript);
        }

        copyBtn.disabled = false;
        clearInterval(procTimer);
        setStatus('Copied ✓', 'done');
        setTimeout(() => setStatus('Ready'), 2000);
      } catch (e) {
        clearInterval(procTimer);
        document.querySelector('.mini-app').classList.remove('streaming');
        if (e.name === 'AbortError') {
          setStatus('Cancelled', 'error');
          setTimeout(() => setStatus('Ready'), 1500);
        } else {
          setStatus('Error', 'error');
          setTimeout(() => setStatus('Ready'), 3000);
        }
      }
      processingAbortController = null;
      resetButton();
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        startTimer();
        if (navigator.vibrate) navigator.vibrate(10);
        toggleBtn.classList.add('recording');
        toggleBtn.innerHTML = '<div class="stop-icon"></div>';
        isRecording = true;
        setStatus('Recording…', 'active');

        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = async () => {
          stopTimer();
          toggleBtn.classList.remove('recording');
          if (cancelled) { cancelled = false; audioChunks = []; resetButton(); setStatus('Cancelled', 'error'); setTimeout(() => setStatus('Ready'), 1200); return; }
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          await transcribeAndClean(blob);
        };
        mediaRecorder.start();
      } catch {
        resetButton(); setStatus('Mic denied', 'error'); setTimeout(() => setStatus('Ready'), 2500);
      }
    }

    function stopRecording() {
      if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
      mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop());
      isRecording = false;
    }

    function resetButton() {
      isRecording = false;
      toggleBtn.classList.remove('recording', 'processing');
      toggleBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
    }

    toggleBtn.onclick = () => isRecording ? stopRecording() : startRecording();

    copyBtn.onclick = async () => {
      const text = isAppendMode() ? getAccumulatedTranscript() : transcript;
      if (!text) return;
      const ok = await copyToClipboard(text);
      if (ok) { setStatus('Copied ✓', 'done'); setTimeout(() => setStatus('Ready'), 2000); }
      else { setStatus('Copy failed', 'error'); setTimeout(() => setStatus('Ready'), 3000); }
    };

    // Keyboard shortcuts
    document.addEventListener('keydown', e => {
      if (e.key === 's' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); toggleBtn.click(); }
      if (e.key === 'p' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); copyBtn.click(); }
      if (e.key === 'c' && !e.ctrlKey && !e.metaKey) {
        if (processingAbortController) { processingAbortController.abort(); processingAbortController = null; }
        else if (isRecording) { cancelled = true; mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(t => t.stop()); }
      }
    });

    // Init
    if (getAccumulatedTranscript()) copyBtn.disabled = false;

    // Register service worker for PWA install
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
